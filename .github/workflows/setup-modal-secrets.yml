name: Setup Modal Secrets

on:
  workflow_dispatch:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Sync qwen-tune-api-key secret
        env:
          QWEN_TUNE_API_KEY: ${{ secrets.QWEN_TUNE_API_KEY }}
        run: |
          modal secret create qwen-tune-api-key \
            QWEN_TUNE_API_KEY="$QWEN_TUNE_API_KEY" \
            --force
